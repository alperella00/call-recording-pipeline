[project]
name = "callpipe"
version = "0.1.0"
description = "Multi-tenant call recording pipeline: transcribe, mask, extract, send to CRM."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
